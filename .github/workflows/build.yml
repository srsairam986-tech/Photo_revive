name: Build Photo Revive APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # ---- 1. free AI models: download once, convert for the phone, cache for next builds
      - name: Cache AI models
        id: models
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/models
          key: models-v1-${{ hashFiles('tools/export_models.py') }}

      - uses: actions/setup-python@v5
        if: steps.models.outputs.cache-hit != 'true'
        with:
          python-version: "3.11"

      - name: Convert AI models (DDColor tiny + Real-ESRGAN)
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          pip install "numpy<2" onnx==1.16.1 onnxruntime==1.19.2 huggingface_hub==0.24.6 opencv-python-headless==4.10.0.84 safetensors tqdm pyyaml scikit-image requests
          git clone --depth 1 https://github.com/piddnad/DDColor.git DDColor
          python tools/export_models.py --ddcolor-repo DDColor --out app/src/main/assets/models
          ls -la app/src/main/assets/models

      # ---- 2. build the Android app
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # One signing key, made on the first build and remembered in the build cache,
      # so every new APK installs straight over the previous one.
      - name: Restore app signing key
        id: signkey
        uses: actions/cache@v4
        with:
          path: ~/.revive-key
          key: revive-signing-key-v1

      - name: Create app signing key (first build only)
        if: steps.signkey.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.revive-key
          keytool -genkeypair -keystore ~/.revive-key/photorevive.jks -storetype JKS -alias photorevive \
            -keyalg RSA -keysize 2048 -validity 10950 -storepass photorevive -keypass photorevive \
            -dname "CN=Photo Revive, O=Sairam, C=IN"

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoRevive-apk
          path: app/build/outputs/apk/release/*.apk

      # ---- 3. direct .apk download (no zip): GitHub Release "latest"
      - name: Publish APK as a direct download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/*.apk PhotoRevive.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest PhotoRevive.apk --title "Photo Revive (latest)" --notes "Tap PhotoRevive.apk to download, then install it on your phone." --target "$GITHUB_SHA"
