name: Preview results with real AI models

on:
  push:
    branches: [preview]
    paths-ignore: ["preview/results/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reuse the converted AI models from the main build
        uses: actions/cache/restore@v4
        with:
          path: app/src/main/assets/models
          key: models-v1-${{ hashFiles('tools/export_models.py') }}
          fail-on-cache-miss: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the app's pipeline on test photos
        run: |
          pip install "numpy<2" onnxruntime==1.19.2 opencv-python-headless==4.10.0.84
          python preview/run_preview.py

      - name: Save results to the preview branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add preview/results
          git commit -m "Preview results [skip ci]" || echo "nothing to commit"
          git push
